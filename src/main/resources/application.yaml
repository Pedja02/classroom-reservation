# Base configuration - shared by every profile

spring:
  application:
    name: Classroom reservation application

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  # PostgreSQL
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}

  # SMTP
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH}

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# JWTService
jwt:
  algorithm:
    key: ${JWT_ALGORITHM_KEY}

# EncryptionService (BCrypt)
encryption:
  salt:
    rounds: ${ENCRYPTION_SALT_ROUNDS:12}

email:
  from: ${EMAIL_FROM}

app:
  frontend:
    url: ${APP_FRONTEND_URL}
