# LOCAL profile - only what development changes relative to application.yaml.

spring:
  config:
    activate:
      on-profile: local

  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}

  jpa:
    show-sql: ${JPA_SHOW_SQL:true}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}

server:
  error:
    include-message: always

jwt:
  algorithm:
    key: ${JWT_ALGORITHM_KEY:local-development-only-jwt-secret-change-me}
  issuer: ${JWT_ISSUER:WebApi-local}
  expireInSeconds: ${JWT_EXPIRE_IN_SECONDS:604800} # 7 days

encryption:
  salt:
    rounds: ${ENCRYPTION_SALT_ROUNDS:10}

email:
  from: ${EMAIL_FROM:no-reply@webapi.local}

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:4200}
  cors:
    allowed-origins:
      - http://localhost:4200
  security:
    public-endpoints:
      - /api/v1/auth/login
      - /api/v1/auth/register
      - /api/v1/auth/verify
      - /actuator/**
      - /ws/**

logging:
  level:
    root: INFO
    com.NJT.WebApi: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE   # logs bound query parameters
    org.springframework.web.socket: DEBUG
