# PRODUCTION profile - only what production changes relative to application.yaml.

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}

  mail:
    properties:
      mail:
        smtp:
          starttls:
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:true}

server:
  # Required when running behind nginx / a load balancer.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}
  tomcat:
    max-threads: ${SERVER_MAX_THREADS:200}
    accesslog:
      enabled: ${SERVER_ACCESSLOG_ENABLED:false}

jwt:
  issuer: ${JWT_ISSUER:WebApi}
  expireInSeconds: ${JWT_EXPIRE_IN_SECONDS:86400} # 1 day

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS} # Comma-separated list of origins
  security:
    public-endpoints: # Reachable without a JWT
      - /api/v1/auth/login
      - /api/v1/auth/register
      - /api/v1/auth/verify
      - /actuator/health
      - /ws/**

logging:
  level:
    root: WARN
    com.NJT.WebApi: INFO
    org.hibernate.SQL: WARN
    # Quoted: bare OFF is a YAML boolean and would fail to bind as a log level.
    org.hibernate.orm.jdbc.bind: "OFF"   # never log query parameters in production
    org.springframework.web.socket: WARN
  file:
    name: /var/log/webapi/application.log
